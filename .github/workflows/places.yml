name: mtop-places

# Xarita ma'lumotini (OpenStreetMap, O'zbekiston) oyiga bir marta yangilaydi. Qo'lda: Actions -> mtop-places -> Run workflow.
on:
  schedule:
    - cron: "41 3 5 * *"
  workflow_dispatch:

jobs:
  places:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install osmium
      - name: Joylarni yuborish
        env:
          MTOP_URL: ${{ secrets.MTOP_URL }}
          MTOP_KEY: ${{ secrets.MTOP_KEY }}
        run: python mtop_worker.py places
